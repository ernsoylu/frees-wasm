name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The wasm bundle is a product constraint, not an afterthought (PLAN.md §3).
  # Gate it from day one, while there is nothing to gate — a budget introduced
  # after the bundle is already large is a budget that gets raised, not met.
  #
  # 2026-07-31: raised 2048 -> 3072 deliberately, to unblock Phase 6 (the
  # 295-component library). Phase 5 left the module at 1867 KiB, 91% of the old
  # ceiling, so components would have breached it. This is ACCEPTED DEBT, not a
  # new normal — two concrete ways to pay it down, in order of value:
  #   1. Move the 528 KB of linked property tables onto the fetch seam that
  #      already exists (props/tables.rs::install_from_bytes). Blocked on the
  #      solver being synchronous; see the deviation note in that module.
  #   2. Split the engine into lazily-loaded chunks (properties, components)
  #      so a document that names neither pays for neither.
  # Do not raise this again without doing one of them first.
  #
  # 2026-07-31, end of Phase 6: measured 2184.5 KiB raw / 1086.2 KiB gzipped —
  # 71.1% of the new ceiling, 887.5 KiB of headroom. The components layer cost
  # +317.9 KiB (122 KB of it the embedded .frees library text). NEITHER DEBT WAS
  # PAID. Note for whoever picks up (2): engine.rs::expand_component_layer
  # already early-returns before parsing a byte of the library when a document
  # declares no components, so the chunk boundary exists in the code and only
  # the linker does not know about it.
  #
  # 2026-08-01, end of Phase 10 (recorded late, with Phases 7-9 uncarried —
  # docs/status-phase10.md gap 9 called that erosion out; their numbers live in
  # their status docs): 2944 KiB raw / 1390 KiB gzipped, 95.8% of the ceiling,
  # 128 KiB of headroom. Phase 9's opt-level="s" spent the profile lever
  # (-535 KiB); Phase 10's mf4-rs + measurement code cost +175.2 KiB. NEITHER
  # DEBT WAS PAID and the headroom is now smaller than a typical phase.
  #
  # 2026-08-05, end of Phase 11: the wasm module is UNTOUCHED (still 2944 KiB
  # raw / 1390 KiB gzipped) — the phase is JS-side (IndexedDB project library,
  # service worker + PWA). The service worker precaches the full dist
  # (~30 MB, dominated by Plotly/spreadsheet lazy chunks), which is a
  # first-visit download cost, not a wasm-budget cost. Debts above still open.
  #
  # 2026-08-05, MDF4 removal (decision D6): 2832 KiB raw / 1345 KiB gzipped —
  # the FIRST decrease since Phase 6 (−112 KiB: mdf4.rs + mf4-rs + the
  # opened-file registry), and the workspace's only future-incompat warning
  # (meval -> nom 1.2.4) left with it. 92.2% of the ceiling, 240 KiB headroom.
  # The two structural debts above remain the real levers.
  #
  # 2026-08-17, decision D9 (docs/decisions/0009-rustprop-backend.md): DEBT (1)
  # IS PAID. 2700.3 KiB raw / 1109.5 KiB gzipped — 87.9% of the ceiling and
  # 371.7 KiB of headroom, from 3042.3 / 1597.7 at 99.0% and 29.7 KiB. The wasm
  # ships rustprop as its only in-bundle property backend and the linked
  # .phtab/.fraux artifacts leave with the `linked-tables` feature, so the engine
  # got MORE accurate (bit-exact CoolProp 8.0.0, 12 of the 23 parity tolerance
  # entries retired) while getting 31% smaller on the wire. Measured per corner:
  # the artifacts cost 683.9 KiB raw and the same gzipped — they are already
  # deflated, so the browser's gzip finds nothing — against rustprop's 342.0 KiB
  # raw / 196.7 KiB gzipped. Debt (2), the lazy chunk, is untouched and is now
  # the only structural lever left; at 87.9% nothing needs it.
  #
  # 2026-08-19, Wave-4 F9 re-measurement: 2721.9 KiB raw / 1118.2 KiB gzipped —
  # 88.6% of the ceiling, 350.1 KiB of headroom. +21.6 KiB raw / +8.7 KiB
  # gzipped in two waves (rustprop advanced under the dependency); the D9 row
  # above was taken mid-wave and is the switch-over number, not a current one.
  # Re-measured because it is the number every other document quotes. Also
  # re-checked the finding that makes `linked-tables` a GUARD rather than a
  # saving: building with `--features frees-core/linked-tables` still comes out
  # within 2 bytes (2 787 264 vs 2 787 262), because installing rustprop is what
  # makes the data section unreachable and LTO drops it. Debt (2) still untouched
  # and still unneeded.
  #
  # 2026-08-22: raised 3072 -> 4096, owner-authorized, after Wave B wired the
  # entire Phase-8 analysis layer (solve_table, monte_carlo, optimize,
  # optimize_multi, curve_fit, parameter_fit, pid_tune, extract_plant) for
  # +340 KiB and left 7.1 KiB of headroom at 3064.9 KiB raw / ~1250 gzipped.
  # The raise is sanctioned by this header's own rule: debt (1) was paid by
  # D9. Before raising, every cheaper lever was re-measured and found spent:
  # wasm-opt -Oz / opt-level="s" / LTO / codegen-units=1 all active,
  # wasm-pack 0.15's binaryen produces byte-identical output, and twiggy
  # shows no item above 0.75% — the growth is diffuse (serde DTO
  # monomorphisation + eight new export paths), so only debt (2), the lazy
  # chunk split, can shrink it structurally. That stays the pay-down path if
  # this ceiling is ever approached again; do not raise past 4096 without
  # doing it.
  #
  # 2026-08-23, Wave G2: 3092.6 KiB raw / 1266.5 KiB gzipped — +25.5 raw /
  # +19.5 gzipped for the `carbondioxide` rustprop-data feature, linked so
  # `MolarMass(CarbonDioxide)` answers (docs_fluids_materials_03, the pending
  # set's last property-linkage hold, promoted bit-exact). Measured per this
  # gate's own method: baseline 3 140 655 bytes, with CO2 3 166 815. 75.5 % of
  # the ceiling, 1 003 KiB headroom. `served_fluids` (the diagram picker) is
  # deliberately unchanged. Debt (2) untouched and unneeded.
  WASM_BUDGET_KB: 4096

jobs:
  native:
    name: native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Wave D6: the library must keep compiling with every feature off —
      # `linked-tables` and `rustprop-backend` are both optional, and nothing
      # else exercised this configuration (D9 recorded it as untested).
      - name: Check --no-default-features
        run: cargo check -p frees-core --no-default-features

      - name: Test
        run: cargo test --workspace

  wasm:
    name: wasm build + size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.13.1

      - name: Build wasm package
        run: wasm-pack build crates/frees-wasm --release --target web --out-dir ../../pkg

      - name: Enforce bundle budget
        run: |
          set -euo pipefail
          wasm=$(find pkg -name '*.wasm' | head -1)
          if [[ -z "$wasm" ]]; then
            echo "::error::no .wasm produced by wasm-pack"
            exit 1
          fi
          bytes=$(stat -c%s "$wasm")
          kb=$(( bytes / 1024 ))
          gz=$(gzip -c "$wasm" | wc -c)
          gzkb=$(( gz / 1024 ))
          echo "wasm: ${kb} KiB raw, ${gzkb} KiB gzipped (budget ${WASM_BUDGET_KB} KiB raw)"
          echo "### Bundle size" >> "$GITHUB_STEP_SUMMARY"
          echo "| metric | value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| raw | ${kb} KiB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| gzipped | ${gzkb} KiB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| budget (raw) | ${WASM_BUDGET_KB} KiB |" >> "$GITHUB_STEP_SUMMARY"
          if (( kb > WASM_BUDGET_KB )); then
            echo "::error::wasm bundle ${kb} KiB exceeds the ${WASM_BUDGET_KB} KiB budget"
            echo "Raise WASM_BUDGET_KB deliberately, with a reason — do not bump it to go green."
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frees-wasm-pkg
          path: pkg/

  web:
    name: web build (wasm + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.13.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Pinned by web/.nvmrc. Node 20.x cannot run the vitest suite:
          # jsdom@30 pulls undici@8, whose CacheStorage calls
          # webidl.util.markAsUncloneable — absent before Node 22 — so every
          # test file dies at environment setup.
          node-version-file: web/.nvmrc
          # Caches ~/.npm keyed on the lockfile — the supported way to speed up
          # `npm ci` (which deletes node_modules on every run by design, so
          # caching node_modules itself would be wasted work).
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build wasm package into the web tree
        # web/src/wasm/pkg is generated output (gitignored); the worker imports
        # from it, so it must exist before the Vite build.
        run: wasm-pack build crates/frees-wasm --release --target web --out-dir ../../web/src/wasm/pkg

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Frontend tests
        working-directory: web
        # --no-install: fail rather than fetch a package at run time.
        # The version comes from the lockfile npm ci just installed.
        run: npx --no-install vitest run

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Verify the wasm asset shipped in dist
        working-directory: web
        run: |
          set -euo pipefail
          wasm=$(find dist -name '*.wasm' | head -1)
          if [[ -z "$wasm" ]]; then
            echo "::error::no .wasm asset in dist — the engine worker did not bundle"
            exit 1
          fi
          echo "bundled wasm asset: $wasm ($(stat -c%s "$wasm") bytes)"

      - name: Verify the PWA shipped in dist (Phase 11)
        working-directory: web
        run: |
          set -euo pipefail
          for f in dist/sw.js dist/manifest.webmanifest dist/icons/icon-512.png; do
            if [[ ! -f "$f" ]]; then
              echo "::error::$f missing — the PWA layer did not build"
              exit 1
            fi
          done
          # The offline promise is only as good as the precache: the service
          # worker must reference the wasm engine by its hashed name.
          if ! grep -q '\.wasm' dist/sw.js; then
            echo "::error::dist/sw.js does not precache the wasm engine"
            exit 1
          fi
          echo "sw.js precaches $(grep -o 'revision' dist/sw.js | wc -l) manifest (present), wasm referenced"

      # Wave D4, closing Phase 11's gap 7: the steps above only assert the
      # PWA files EXIST — this actually RUNS the service worker: first-visit
      # precache, an offline reload, an offline Solve of the boot document
      # graded against the parity golden's value, and zero /api/ requests.
      - name: Install Playwright chromium
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium

      - name: Offline PWA proof (Playwright)
        working-directory: web
        run: npx --no-install playwright test

  parity:
    name: parity corpus
    runs-on: ubuntu-latest
    # The golden fixtures are generated from the Java engine, which is not
    # available in CI (it needs ../frEES and its Gradle cache). Fixtures are
    # committed, so CI replays them without regenerating.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Replay golden corpus
        run: |
          set -euo pipefail
          count=$(find fixtures/golden -name '*.json' | wc -l)
          echo "replaying ${count} golden fixtures"
          if (( count == 0 )); then
            echo "::error::no fixtures found — the parity harness is not wired"
            exit 1
          fi
          cargo test --workspace --test parity -- --nocapture
