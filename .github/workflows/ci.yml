name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The wasm bundle is a product constraint, not an afterthought (PLAN.md §3).
  # Gate it from day one, while there is nothing to gate — a budget introduced
  # after the bundle is already large is a budget that gets raised, not met.
  #
  # 2026-07-31: raised 2048 -> 3072 deliberately, to unblock Phase 6 (the
  # 295-component library). Phase 5 left the module at 1867 KiB, 91% of the old
  # ceiling, so components would have breached it. This is ACCEPTED DEBT, not a
  # new normal — two concrete ways to pay it down, in order of value:
  #   1. Move the 528 KB of linked property tables onto the fetch seam that
  #      already exists (props/tables.rs::install_from_bytes). Blocked on the
  #      solver being synchronous; see the deviation note in that module.
  #   2. Split the engine into lazily-loaded chunks (properties, components)
  #      so a document that names neither pays for neither.
  # Do not raise this again without doing one of them first.
  #
  # 2026-07-31, end of Phase 6: measured 2184.5 KiB raw / 1086.2 KiB gzipped —
  # 71.1% of the new ceiling, 887.5 KiB of headroom. The components layer cost
  # +317.9 KiB (122 KB of it the embedded .frees library text). NEITHER DEBT WAS
  # PAID. Note for whoever picks up (2): engine.rs::expand_component_layer
  # already early-returns before parsing a byte of the library when a document
  # declares no components, so the chunk boundary exists in the code and only
  # the linker does not know about it.
  #
  # 2026-08-01, end of Phase 10 (recorded late, with Phases 7-9 uncarried —
  # docs/status-phase10.md gap 9 called that erosion out; their numbers live in
  # their status docs): 2944 KiB raw / 1390 KiB gzipped, 95.8% of the ceiling,
  # 128 KiB of headroom. Phase 9's opt-level="s" spent the profile lever
  # (-535 KiB); Phase 10's mf4-rs + measurement code cost +175.2 KiB. NEITHER
  # DEBT WAS PAID and the headroom is now smaller than a typical phase.
  #
  # 2026-08-05, end of Phase 11: the wasm module is UNTOUCHED (still 2944 KiB
  # raw / 1390 KiB gzipped) — the phase is JS-side (IndexedDB project library,
  # service worker + PWA). The service worker precaches the full dist
  # (~30 MB, dominated by Plotly/spreadsheet lazy chunks), which is a
  # first-visit download cost, not a wasm-budget cost. Debts above still open.
  #
  # 2026-08-05, MDF4 removal (decision D6): 2832 KiB raw / 1345 KiB gzipped —
  # the FIRST decrease since Phase 6 (−112 KiB: mdf4.rs + mf4-rs + the
  # opened-file registry), and the workspace's only future-incompat warning
  # (meval -> nom 1.2.4) left with it. 92.2% of the ceiling, 240 KiB headroom.
  # The two structural debts above remain the real levers.
  #
  # 2026-08-17, decision D9 (docs/decisions/0009-rustprop-backend.md): DEBT (1)
  # IS PAID. 2700.3 KiB raw / 1109.5 KiB gzipped — 87.9% of the ceiling and
  # 371.7 KiB of headroom, from 3042.3 / 1597.7 at 99.0% and 29.7 KiB. The wasm
  # ships rustprop as its only in-bundle property backend and the linked
  # .phtab/.fraux artifacts leave with the `linked-tables` feature, so the engine
  # got MORE accurate (bit-exact CoolProp 8.0.0, 12 of the 23 parity tolerance
  # entries retired) while getting 31% smaller on the wire. Measured per corner:
  # the artifacts cost 683.9 KiB raw and the same gzipped — they are already
  # deflated, so the browser's gzip finds nothing — against rustprop's 342.0 KiB
  # raw / 196.7 KiB gzipped. Debt (2), the lazy chunk, is untouched and is now
  # the only structural lever left; at 87.9% nothing needs it.
  #
  # 2026-08-19, Wave-4 F9 re-measurement: 2721.9 KiB raw / 1118.2 KiB gzipped —
  # 88.6% of the ceiling, 350.1 KiB of headroom. +21.6 KiB raw / +8.7 KiB
  # gzipped in two waves (rustprop advanced under the dependency); the D9 row
  # above was taken mid-wave and is the switch-over number, not a current one.
  # Re-measured because it is the number every other document quotes. Also
  # re-checked the finding that makes `linked-tables` a GUARD rather than a
  # saving: building with `--features frees-core/linked-tables` still comes out
  # within 2 bytes (2 787 264 vs 2 787 262), because installing rustprop is what
  # makes the data section unreachable and LTO drops it. Debt (2) still untouched
  # and still unneeded.
  #
  # 2026-08-22: raised 3072 -> 4096, owner-authorized, after Wave B wired the
  # entire Phase-8 analysis layer (solve_table, monte_carlo, optimize,
  # optimize_multi, curve_fit, parameter_fit, pid_tune, extract_plant) for
  # +340 KiB and left 7.1 KiB of headroom at 3064.9 KiB raw / ~1250 gzipped.
  # The raise is sanctioned by this header's own rule: debt (1) was paid by
  # D9. Before raising, every cheaper lever was re-measured and found spent:
  # wasm-opt -Oz / opt-level="s" / LTO / codegen-units=1 all active,
  # wasm-pack 0.15's binaryen produces byte-identical output, and twiggy
  # shows no item above 0.75% — the growth is diffuse (serde DTO
  # monomorphisation + eight new export paths), so only debt (2), the lazy
  # chunk split, can shrink it structurally. That stays the pay-down path if
  # this ceiling is ever approached again; do not raise past 4096 without
  # doing it.
  #
  # 2026-08-23, Wave G2: 3092.6 KiB raw / 1266.5 KiB gzipped — +25.5 raw /
  # +19.5 gzipped for the `carbondioxide` rustprop-data feature, linked so
  # `MolarMass(CarbonDioxide)` answers (docs_fluids_materials_03, the pending
  # set's last property-linkage hold, promoted bit-exact). Measured per this
  # gate's own method: baseline 3 140 655 bytes, with CO2 3 166 815. 75.5 % of
  # the ceiling, 1 003 KiB headroom. `served_fluids` (the diagram picker) is
  # deliberately unchanged. Debt (2) untouched and unneeded.
  WASM_BUDGET_KB: 4096

jobs:
  native:
    name: native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Wave D6: the library must keep compiling with every feature off —
      # `linked-tables` and `rustprop-backend` are both optional, and nothing
      # else exercised this configuration (D9 recorded it as untested).
      - name: Check --no-default-features
        run: cargo check -p frees-core --no-default-features

      # The golden-corpus replay is DELIBERATELY skipped here, and this is the
      # only place that says so. `tests/parity.rs` is an ordinary integration
      # test of `frees-core`, so `cargo test --workspace` runs it — the whole
      # corpus, unsharded, in this debug profile — while the four
      # `parity corpus i/4` jobs below replay the *same* corpus in the *same*
      # profile, and their shards provably sum to it (parity.rs refuses every
      # configuration that could under-replay and prints a census whose
      # `replayed` values must total `corpus`). It was pure duplicate work, and
      # it was the whole workflow's critical path: on the S1 run
      # (32912981189, 2026-08-25/26) this step took 14m26s of a 15m09s job,
      # while the four shards finished in 0m57s / 1m27s / 1m35s / 3m43s.
      #
      # Nothing else is skipped: every other suite in the workspace still runs
      # here, including the debug-only ones (`dynamics_robustness` found a
      # stack overflow that only reproduces unoptimised).
      #
      # There WAS a second whole-corpus pass in this job, and it is gone too
      # (Wave T3). `props_robustness`'s
      # `no_promoted_fixture_solves_to_a_non_finite_value` solved every document
      # in `fixtures/corpus` a second time, one thread, in this debug profile —
      # measured at 946.90 s on a dev box against 986.41 s for the replay, i.e.
      # the two passes were the same size and this job paid for both. The
      # assertion did not go away: it moved into `tests/parity.rs`, which was
      # already solving every fixture, and where it also closes a blind spot the
      # replay had on its own (`close`/`rel_diff` treat NaN against NaN as
      # agreement). So it now runs in the four shards below, exactly once across
      # their union, and this job does not pay for it at all.
      #
      # Nothing else here walks the corpus and solves it: `matrix_expansion`
      # only parses it and `dynamics_robustness` only reads `points =` out of
      # the source text.
      #
      # This is deliberately NOT the failure `fixtures/README.md` warns about
      # under "the single-package form refuses" — that a gate which can vanish
      # from a run is a gate that quietly asserts nothing. The harness is
      # untouched: `cargo test --workspace` still replays the corpus for every
      # developer, and `tests/parity.rs` still refuses `required-features` for
      # exactly that reason. What is skipped here is one JOB in a workflow whose
      # other four jobs replay the whole corpus and fail it if any shard fails.
      # If those four are ever removed, this line must go with them.
      #
      # The filter is by NAME, so a rename would silently restore the
      # duplication — slower, never less covered, but silent. The grep turns
      # that into a red build instead.
      - name: Test
        run: |
          grep -q 'fn golden_corpus_parity' crates/frees-core/tests/parity.rs || {
            echo "::error::the parity test was renamed — update the --skip filter in this step"
            exit 1
          }
          cargo test --workspace -- --skip golden_corpus_parity

  wasm:
    name: wasm build + size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.13.1

      - name: Build wasm package
        run: wasm-pack build crates/frees-wasm --release --target web --out-dir ../../pkg

      - name: Enforce bundle budget
        run: |
          set -euo pipefail
          wasm=$(find pkg -name '*.wasm' | head -1)
          if [[ -z "$wasm" ]]; then
            echo "::error::no .wasm produced by wasm-pack"
            exit 1
          fi
          bytes=$(stat -c%s "$wasm")
          kb=$(( bytes / 1024 ))
          gz=$(gzip -c "$wasm" | wc -c)
          gzkb=$(( gz / 1024 ))
          echo "wasm: ${kb} KiB raw, ${gzkb} KiB gzipped (budget ${WASM_BUDGET_KB} KiB raw)"
          echo "### Bundle size" >> "$GITHUB_STEP_SUMMARY"
          echo "| metric | value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| raw | ${kb} KiB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| gzipped | ${gzkb} KiB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| budget (raw) | ${WASM_BUDGET_KB} KiB |" >> "$GITHUB_STEP_SUMMARY"
          if (( kb > WASM_BUDGET_KB )); then
            echo "::error::wasm bundle ${kb} KiB exceeds the ${WASM_BUDGET_KB} KiB budget"
            echo "Raise WASM_BUDGET_KB deliberately, with a reason — do not bump it to go green."
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frees-wasm-pkg
          path: pkg/

  web:
    name: web build (wasm + vite)
    runs-on: ubuntu-latest
    # YES, this rebuilds the wasm the `wasm` job above already built and
    # uploaded, and NO, passing it as an artifact would not help — measured on
    # run 32957800094, where this became the workflow's critical path once the
    # two corpus replays left the `native` job (T1, T3):
    #
    #   wasm job        2m03s total  (1m43s of it the build)
    #   web job         3m32s total  (1m44s of it the same build; the rest is
    #                                 npm ci 12s, vitest 16s, vite build 24s,
    #                                 playwright install 24s, the proof 4s)
    #
    # They run in PARALLEL, so today's critical path is max(123, 212) = 212 s.
    # Adding `needs: wasm` + download-artifact serialises them: 123 s of wasm
    # then 108 s of everything else = 231 s, i.e. 19 s SLOWER. The duplicated
    # build is what buys the parallelism; what it costs is runner minutes, and
    # nothing here is paying for those in wall clock. Merging the two jobs is
    # also a wash on wall clock (~212 s either way) and trades away the size
    # gate's isolation, since a red vitest would then hide it.
    #
    # The uploaded `frees-wasm-pkg` artifact has no consumer in this workflow —
    # no `needs:`, no download-artifact anywhere — it exists for humans.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.13.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pinned by web/.nvmrc. Node 20.x cannot run the vitest suite:
          # jsdom@30 pulls undici@8, whose CacheStorage calls
          # webidl.util.markAsUncloneable — absent before Node 22 — so every
          # test file dies at environment setup.
          node-version-file: web/.nvmrc
          # Caches ~/.npm keyed on the lockfile — the supported way to speed up
          # `npm ci` (which deletes node_modules on every run by design, so
          # caching node_modules itself would be wasted work).
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build wasm package into the web tree
        # web/src/wasm/pkg is generated output (gitignored); the worker imports
        # from it, so it must exist before the Vite build.
        run: wasm-pack build crates/frees-wasm --release --target web --out-dir ../../web/src/wasm/pkg

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Frontend tests
        working-directory: web
        # --no-install: fail rather than fetch a package at run time.
        # The version comes from the lockfile npm ci just installed.
        run: npx --no-install vitest run

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Verify the wasm asset shipped in dist
        working-directory: web
        run: |
          set -euo pipefail
          wasm=$(find dist -name '*.wasm' | head -1)
          if [[ -z "$wasm" ]]; then
            echo "::error::no .wasm asset in dist — the engine worker did not bundle"
            exit 1
          fi
          echo "bundled wasm asset: $wasm ($(stat -c%s "$wasm") bytes)"

      - name: Verify the PWA shipped in dist (Phase 11)
        working-directory: web
        run: |
          set -euo pipefail
          for f in dist/sw.js dist/manifest.webmanifest dist/icons/icon-512.png; do
            if [[ ! -f "$f" ]]; then
              echo "::error::$f missing — the PWA layer did not build"
              exit 1
            fi
          done
          # The offline promise is only as good as the precache: the service
          # worker must reference the wasm engine by its hashed name.
          if ! grep -q '\.wasm' dist/sw.js; then
            echo "::error::dist/sw.js does not precache the wasm engine"
            exit 1
          fi
          echo "sw.js precaches $(grep -o 'revision' dist/sw.js | wc -l) manifest (present), wasm referenced"

      # Wave D4, closing Phase 11's gap 7: the steps above only assert the
      # PWA files EXIST — this actually RUNS the service worker: first-visit
      # precache, an offline reload, an offline Solve of the boot document
      # graded against the parity golden's value, and zero /api/ requests.
      - name: Install Playwright chromium
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium

      - name: Offline PWA proof (Playwright)
        working-directory: web
        run: npx --no-install playwright test

  parity:
    name: parity corpus ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # The golden fixtures are generated from the Java engine, which is not
    # available in CI (it needs ../frEES and its Gradle cache). Fixtures are
    # committed, so CI replays them without regenerating.
    #
    # 2026-08-25, Wave Q2: SHARDED. This is the longest gate in the workflow and
    # it grows with the corpus — 983 fixtures / ~145 s (release, dev box) two
    # waves ago, 1281 / ~362 s now, and ~15 min of wall clock in this job, which
    # runs a debug build. The replay is embarrassingly parallel across fixtures,
    # so it is split over `i % 4 == shard` of the SORTED golden listing;
    # crates/frees-core/tests/parity.rs owns the partition, refuses every
    # configuration that could under-replay, and prints a `parity-shard:` census
    # line whose `replayed` values must sum to `corpus`.
    #
    # FOUR, and the reason is a measurement rather than a round number. Timed
    # per fixture (release, 317.4 s inside the replay loop), the cost is
    # concentrated in ONE document: ev-battery-cooling-pid is 193.0 s, 60.8% of
    # the whole gate, and the top 20 of 1281 are 89.4%. No partition splits one
    # fixture, so 193 s is the floor for every shard count. Measured longest
    # shard: N=2 273.8 s, N=4 227.7 s, N=8 202.7 s, ideal-with-an-oracle 193.0 s.
    # Four takes the longest shard from 317.4 to 227.7 s and leaves the others at
    # 33.0/10.6/46.1 s; eight buys 25 s more for four more runners. The value of
    # four is not today's 1.39x, it is that the gate stays BOUNDED as the corpus
    # grows: the largest non-critical shard has room for ~4x growth (to ~5400
    # fixtures) before it reaches the critical path and wall clock moves again.
    #
    # Read that table as the finding it is: the parity gate's real lever is not
    # sharding, it is that one transient fixture is 61% of it.
    #
    # 2026-08-26: that lever was pulled, and every number above is now history.
    # Wave R2 ported the Java's PropsSI cache, which is worth 1.78x on
    # ev-battery-cooling-pid alone. Compare shares rather than seconds — the two
    # measurements are from different machines (the whole replay was 317.4 s
    # there and is 126.98 s here): that one fixture was 60.8% of the gate and is
    # now ~36% of it. Re-measured at HEAD (release, quiet box): 126.98 s
    # unsharded, and the four shards timed one at a time are
    # 11.97 / 17.36 / 46.35 / 52.49 s, with ev-battery-cooling-pid contributing
    # 45.86 s of the 52.49 s one. The "no partition splits a fixture" floor this
    # comment reasoned from is therefore ~46 s of a ~127 s gate, not 193 s of a
    # 317 s one, so N=4 is no longer load-bearing for wall clock — it is kept
    # because it is nearly free (three legs of the S1 run finished inside 100 s,
    # the critical one in 3m43s) and because it keeps the gate bounded as the
    # corpus grows, which was always the real argument. What made the workflow
    # 15 minutes long was never this job: it was the `native` job replaying the
    # same corpus a fifth time, unsharded, in the same debug profile. See the
    # Test step above.
    strategy:
      # Each shard reports its own divergences. A parity failure is a LIST of
      # fixtures, and cancelling the siblings on the first red would hide three
      # quarters of it — the point of the gate is the whole list. The workflow
      # still fails: a failed matrix leg fails its job, and a failed job fails
      # the run.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      # Must equal the length of `matrix.shard` above, and it is self-guarding:
      # parity.rs panics when the index is outside 0..count, so adding a fifth
      # matrix entry without bumping this fails loudly instead of skipping a
      # quarter of the corpus.
      PARITY_SHARD_COUNT: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # One cache for all four shards: they build the identical artifact, so
          # keying per matrix leg (the default) would build it four times over
          # and store four copies of it. Only shard 0 writes.
          shared-key: parity
          save-if: ${{ matrix.shard == 0 }}

      - name: Replay golden corpus (shard ${{ matrix.shard }} of 4)
        env:
          PARITY_SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          count=$(find fixtures/golden -name '*.json' | wc -l)
          echo "replaying shard ${PARITY_SHARD_INDEX}/${PARITY_SHARD_COUNT} of ${count} golden fixtures"
          if (( count == 0 )); then
            echo "::error::no fixtures found — the parity harness is not wired"
            exit 1
          fi
          cargo test --workspace --test parity -- --nocapture | tee "$RUNNER_TEMP/parity-shard.log"
          # Surface the census line so a human can sum the four legs and see
          # that the union was the corpus. Not decorative: grep failing here
          # means a green replay printed no census, which would mean the count
          # is unverifiable, so it fails the step.
          {
            echo "### Parity shard ${PARITY_SHARD_INDEX}/${PARITY_SHARD_COUNT}"
            echo '```'
            grep '^parity-shard:' "$RUNNER_TEMP/parity-shard.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
