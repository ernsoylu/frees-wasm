name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The wasm bundle is a product constraint, not an afterthought (PLAN.md §3).
  # Gate it from day one, while there is nothing to gate — a budget introduced
  # after the bundle is already large is a budget that gets raised, not met.
  WASM_BUDGET_KB: 2048

jobs:
  native:
    name: native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  wasm:
    name: wasm build + size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      - name: Build wasm package
        run: wasm-pack build crates/frees-wasm --release --target web --out-dir ../../pkg

      - name: Enforce bundle budget
        run: |
          set -euo pipefail
          wasm=$(find pkg -name '*.wasm' | head -1)
          if [[ -z "$wasm" ]]; then
            echo "::error::no .wasm produced by wasm-pack"
            exit 1
          fi
          bytes=$(stat -c%s "$wasm")
          kb=$(( bytes / 1024 ))
          gz=$(gzip -c "$wasm" | wc -c)
          gzkb=$(( gz / 1024 ))
          echo "wasm: ${kb} KiB raw, ${gzkb} KiB gzipped (budget ${WASM_BUDGET_KB} KiB raw)"
          echo "### Bundle size" >> "$GITHUB_STEP_SUMMARY"
          echo "| metric | value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| raw | ${kb} KiB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| gzipped | ${gzkb} KiB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| budget (raw) | ${WASM_BUDGET_KB} KiB |" >> "$GITHUB_STEP_SUMMARY"
          if (( kb > WASM_BUDGET_KB )); then
            echo "::error::wasm bundle ${kb} KiB exceeds the ${WASM_BUDGET_KB} KiB budget"
            echo "Raise WASM_BUDGET_KB deliberately, with a reason — do not bump it to go green."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: frees-wasm-pkg
          path: pkg/

  web:
    name: web build (wasm + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - uses: actions/setup-node@v4
        with:
          # Pinned by web/.nvmrc. Node 20.x cannot run the vitest suite:
          # jsdom@30 pulls undici@8, whose CacheStorage calls
          # webidl.util.markAsUncloneable — absent before Node 22 — so every
          # test file dies at environment setup.
          node-version-file: web/.nvmrc
          # Caches ~/.npm keyed on the lockfile — the supported way to speed up
          # `npm ci` (which deletes node_modules on every run by design, so
          # caching node_modules itself would be wasted work).
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build wasm package into the web tree
        # web/src/wasm/pkg is generated output (gitignored); the worker imports
        # from it, so it must exist before the Vite build.
        run: wasm-pack build crates/frees-wasm --release --target web --out-dir ../../web/src/wasm/pkg

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Frontend tests
        working-directory: web
        run: npx vitest run

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Verify the wasm asset shipped in dist
        working-directory: web
        run: |
          set -euo pipefail
          wasm=$(find dist -name '*.wasm' | head -1)
          if [[ -z "$wasm" ]]; then
            echo "::error::no .wasm asset in dist — the engine worker did not bundle"
            exit 1
          fi
          echo "bundled wasm asset: $wasm ($(stat -c%s "$wasm") bytes)"

  parity:
    name: parity corpus
    runs-on: ubuntu-latest
    # The golden fixtures are generated from the Java engine, which is not
    # available in CI (it needs ../frEES and its Gradle cache). Fixtures are
    # committed, so CI replays them without regenerating.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Replay golden corpus
        run: |
          set -euo pipefail
          count=$(find fixtures/golden -name '*.json' | wc -l)
          echo "replaying ${count} golden fixtures"
          if (( count == 0 )); then
            echo "::error::no fixtures found — the parity harness is not wired"
            exit 1
          fi
          cargo test --workspace --test parity -- --nocapture
