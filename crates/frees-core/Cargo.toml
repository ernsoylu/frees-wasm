[package]
name = "frees-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The frees equation-solving engine — target-agnostic (native + wasm32)."

[dependencies]
petgraph = { workspace = true }
libm = { workspace = true }
num-bigint = { workspace = true }
num-integer = { workspace = true }
num-rational = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true, optional = true }
# Inflate only — see build.rs and props/tables.rs. The compressor half of the
# crate is unreachable from the library and LTO drops it; what is linked is the
# ~19 KB inflate core, against ~329 KB saved off the data section.
miniz_oxide = { workspace = true }

# The accuracy path (decision D8): rustprop, the pure-Rust CoolProp 8 port, as
# a direct cargo dependency. Its engines and per-fluid data are opt-in Cargo
# features, so this build links exactly the fluids frees serves — nothing
# monolithic. rustprop's shipped crates carry zero external dependencies, which
# is what keeps frees-core clear of wasm-bindgen (the CLAUDE.md hard rule).
# Pinned to the v0.1.0 tag rather than a branch: a git dependency on a moving
# ref would let the property backend change under a green parity corpus. Once
# the crates.io names are claimed this becomes a plain version requirement and
# the `git`/`tag` keys come out. Not a path dependency any more, so GitHub CI
# can finally build the wasm/web jobs, which needed a sibling checkout before.
rustprop = { git = "https://github.com/ernsoylu/RustProp", tag = "v0.1.0", features = [
    "heos",
    "humid-air",
    "incompressible",
], optional = true }
rustprop-data = { git = "https://github.com/ernsoylu/RustProp", tag = "v0.1.0", features = [
    "water",
    "r134a",
    "r1234yf",
    "air",
], optional = true }
# rustprop-core carries the shared parameter types. The warm adapter
# (`props/rustprop_warm.rs`) drives rustprop's LOW-LEVEL `PtFlash` API, and
# `solver_rho_tp_guessed` takes a `params::Phase` that the `rustprop` facade
# does not re-export — using the low-level API means naming its types. Already
# linked transitively by `rustprop`, so this adds nothing to the bundle, and it
# has zero external dependencies like every other shipped rustprop crate.
rustprop-core = { git = "https://github.com/ernsoylu/RustProp", tag = "v0.1.0", optional = true }

# The same crate on the other side of the pipe: build.rs does the deflating.
# Build dependencies are host-only and never reach the wasm module.
[build-dependencies]
miniz_oxide = { workspace = true }

[features]
# `linked-tables` is on by default, so a native build, `frees-cli` and the whole
# test suite keep the D1 artifacts and behave exactly as they always did.
# `frees-wasm` is the one crate that sets `default-features = false` — see D9.
default = ["linked-tables"]
serde = ["dep:serde"]

# The ~678 KiB of packed (P,h)/FRAUX1 grids under `src/props/data`, as linked
# bytes (`props/tables.rs::packed`, `build.rs`). OFF leaves the readers and the
# `install_from_bytes` fetch seam compiled and removes only the *bytes* —
# decision D9, `docs/decisions/0009-rustprop-backend.md`.
linked-tables = []

# Install rustprop as the process's RealFluid backend (D9). OFF is byte-for-byte
# the pre-D9 engine: `install_builtin_once` installs the (P,h) TableBackend.
rustprop-backend = ["dep:rustprop", "dep:rustprop-data", "dep:rustprop-core"]

[dev-dependencies]
serde_json = { workspace = true }

# Phase 12's fuzzing and benchmark dependencies are dev-only AND native-only:
# proptest pulls rand → getrandom, which refuses wasm32-unknown-unknown, and
# CI clippy compiles --all-targets for that target. The two test/bench targets
# carry matching cfg guards (fuzz_properties.rs is empty on wasm32;
# solve_bench.rs supplies a stub main).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "solve_bench"
harness = false
