[package]
name = "frees-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The frees equation-solving engine — target-agnostic (native + wasm32)."

[dependencies]
petgraph = { workspace = true }
libm = { workspace = true }
num-bigint = { workspace = true }
num-integer = { workspace = true }
num-rational = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true, optional = true }
# Inflate only — see build.rs and props/tables.rs. The compressor half of the
# crate is unreachable from the library and LTO drops it; what is linked is the
# ~19 KB inflate core, against ~329 KB saved off the data section.
miniz_oxide = { workspace = true }

# The accuracy path (decision D8): rustprop, the pure-Rust CoolProp 8 port, as
# a direct cargo dependency. Its engines and per-fluid data are opt-in Cargo
# features, so this build links exactly the fluids frees serves — nothing
# monolithic. rustprop's shipped crates carry zero external dependencies, which
# is what keeps frees-core clear of wasm-bindgen (the CLAUDE.md hard rule).
rustprop = { path = "../../../rustprop/crates/rustprop", features = [
    "heos",
    "humid-air",
    "incompressible",
], optional = true }
rustprop-data = { path = "../../../rustprop/crates/rustprop-data", features = [
    "water",
    "r134a",
    "r1234yf",
    "air",
], optional = true }

# The same crate on the other side of the pipe: build.rs does the deflating.
# Build dependencies are host-only and never reach the wasm module.
[build-dependencies]
miniz_oxide = { workspace = true }

[features]
default = []
serde = ["dep:serde"]
rustprop-backend = ["dep:rustprop", "dep:rustprop-data"]

[dev-dependencies]
serde_json = { workspace = true }

# Phase 12's fuzzing and benchmark dependencies are dev-only AND native-only:
# proptest pulls rand → getrandom, which refuses wasm32-unknown-unknown, and
# CI clippy compiles --all-targets for that target. The two test/bench targets
# carry matching cfg guards (fuzz_properties.rs is empty on wasm32;
# solve_bench.rs supplies a stub main).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "solve_bench"
harness = false
