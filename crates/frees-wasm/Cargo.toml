[package]
name = "frees-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "wasm-bindgen boundary and Web Worker protocol for the frees engine."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Decision D9 (`docs/decisions/0009-rustprop-backend.md`): the browser bundle
# ships rustprop as its ONLY in-bundle property backend, so this is the one
# crate in the workspace that turns frees-core's default features off. That
# drops `linked-tables` — the ~678 KiB of packed (P,h)/FRAUX1 artifacts — out
# of the wasm data section; the readers and the `install_from_bytes` fetch seam
# stay compiled, only the bytes go. Spelled as a path rather than
# `workspace = true` because `default-features` cannot be overridden on an
# inherited dependency.
frees-core = { path = "../frees-core", default-features = false, features = [
    "rustprop-backend",
] }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

# wasm-pack invokes wasm-opt after cargo; without this it uses its default and
# the module keeps opt-level=3 (speed) sizing from [profile.release]. `-Oz` is
# the size-first setting, which is the right trade for a module the user
# downloads before they can solve anything.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']
