                  - generic [ref=e480]: h4 = Enthalpy(Water, P=P_cond, s=s3)
                  - generic [ref=e482]: "{ Performance }"
                  - generic [ref=e483]: q_in = h3 - h2
                  - generic [ref=e484]: w_turb = h3 - h4
                  - generic [ref=e485]: eta_th = (w_turb - w_pump) / q_in
