# SonarCloud analysis scope.
#
# SonarCloud runs Automatic Analysis on this repository (a GitHub App — there is
# no scanner step in .github/workflows/ci.yml). This file is how the scope is
# narrowed to code this project actually owns.
#
# The rule applied here: analyse what we wrote, exclude what we vendored or
# generate. Excluding our own code to make a gate go green would be gaming it.

sonar.projectKey=ernsoylu_frees-wasm
sonar.organization=ernsoylu

# ── Vendored, not ours ───────────────────────────────────────────────────────
# `web/` is a verbatim copy of ../frEES/frontend (see web/WASM-PORT.md). Its
# build tooling is upstream's and is meant to stay in sync with it, so a local
# "fix" is a divergence we would have to carry forever. The parts of `web/` we
# DID write — src/api.ts, src/wasm/**, src/defaultExample.ts — are deliberately
# NOT excluded and are analysed like the rest of the port.
# ── Local developer tooling, not part of the shipped artifact ───────────────
# `tools/**` is run by hand on a developer's own machine: the golden dumper and
# table generator (Java, against the reference engine), a table inspector, and a
# static server for the browser proof. None of it is compiled into the wasm
# module, imported by the frontend, or executed in CI.
#
# The remaining findings there are all "path built from user-controlled data" on
# a CLI argument or a loopback HTTP request — i.e. the tool doing its job. This
# is a scope decision, and it is deliberately NOT a substitute for the fix:
# serve-dist.py resolves and containment-checks every request path against the
# served root and 403s outside it, verified by hand with a raw un-normalised
# `../../../../etc/passwd`, which returns the SPA fallback rather than the file.
sonar.exclusions=\
  tools/**,\
  web/scripts/**,\
  web/node_modules/**,\
  web/dist/**,\
  web/src/wasm/pkg/**,\
  fixtures/**,\
  crates/frees-core/src/components/library-data/**,\
  crates/frees-core/src/props/data/**,\
  target/**,\
  pkg/**

# ── Generated or data, not source ────────────────────────────────────────────
# fixtures/**            golden parity data produced by tools/golden-dumper
# components/library-data 295 .frees components, verbatim from the reference repo
# props/data             binary property tables emitted by tools/table-gen
# web/src/wasm/pkg       wasm-pack output
# web/dist, target, pkg  build output

# Duplication in the parity corpus and in transcribed coefficient tables is
# inherent — the same physics document appears with small variations by design.
sonar.cpd.exclusions=\
  fixtures/**,\
  crates/frees-core/src/props/**,\
  crates/frees-core/tests/**
