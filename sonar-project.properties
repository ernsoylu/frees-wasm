# SonarCloud analysis scope.
#
# SonarCloud runs Automatic Analysis on this repository (a GitHub App — there is
# no scanner step in .github/workflows/ci.yml).
#
# !! AUTOMATIC ANALYSIS DOES NOT READ THIS FILE !!  Verified the hard way:
# commit 7bac0895 added `tools/**` here, SonarCloud analysed that exact
# revision, and the tools/ findings were unchanged. Scope for Automatic
# Analysis lives SERVER-SIDE and was set with:
#
#   sonar api POST "/api/settings/set?component=ernsoylu_frees-wasm\
#     &key=sonar.exclusions&values=tools/**&values=web/scripts/**&..."
#
# This file is kept as the readable record of WHY each path is excluded, and it
# becomes authoritative the day analysis moves into CI (a scanner step does read
# it). Change both together, or they drift.
#
# THEY HAD DRIFTED. Checked 2026-08-06: `sonar.cpd.exclusions` was set in this
# file and had NEVER been set server-side, so none of it was in effect and the
# project reported 30.6 % duplication (23,949 lines) with the parity corpus and
# the coefficient tables counted in full. Set with the same call, `key=
# sonar.cpd.exclusions`, values as listed at the bottom of this file. If you
# add a path below, run that call too — a line here alone does nothing.
#
# The rule applied here: analyse what we wrote, exclude what we vendored or
# generate. Excluding our own code to make a gate go green would be gaming it.

sonar.projectKey=ernsoylu_frees-wasm
sonar.organization=ernsoylu

# ── Vendored, not ours ───────────────────────────────────────────────────────
# `web/` is a verbatim copy of ../frEES/frontend (see web/WASM-PORT.md). Its
# build tooling is upstream's and is meant to stay in sync with it, so a local
# "fix" is a divergence we would have to carry forever. The parts of `web/` we
# DID write — src/api.ts, src/wasm/**, src/defaultExample.ts — are deliberately
# NOT excluded and are analysed like the rest of the port.
# ── Local developer tooling, not part of the shipped artifact ───────────────
# `tools/**` is run by hand on a developer's own machine: the golden dumper and
# table generator (Java, against the reference engine), a table inspector, and a
# static server for the browser proof. None of it is compiled into the wasm
# module, imported by the frontend, or executed in CI.
#
# The remaining findings there are all "path built from user-controlled data" on
# a CLI argument or a loopback HTTP request — i.e. the tool doing its job. This
# is a scope decision, and it is deliberately NOT a substitute for the fix:
# serve-dist.py resolves and containment-checks every request path against the
# served root and 403s outside it, verified by hand with a raw un-normalised
# `../../../../etc/passwd`, which returns the SPA fallback rather than the file.
sonar.exclusions=\
  tools/**,\
  web/scripts/**,\
  web/node_modules/**,\
  web/dist/**,\
  web/src/wasm/pkg/**,\
  fixtures/**,\
  crates/frees-core/src/components/library-data/**,\
  crates/frees-core/src/props/data/**,\
  target/**,\
  pkg/**

# ── Generated or data, not source ────────────────────────────────────────────
# fixtures/**            golden parity data produced by tools/golden-dumper
# components/library-data 295 .frees components, verbatim from the reference repo
# props/data             binary property tables emitted by tools/table-gen
# web/src/wasm/pkg       wasm-pack output
# web/dist, target, pkg  build output

# Duplication in the parity corpus and in transcribed coefficient tables is
# inherent — the same physics document appears with small variations by design.
#
# The `web/src/*Catalog.ts` group and its two siblings are the SAME phenomenon
# on the frontend side, and they are the whole of this project's reported
# duplication: measured 2026-08-06, all 23,949 duplicated lines live in six
# files, led by referenceCatalog.ts at 15,239. Every one of them is a data
# module — an array of {title, description, code} entries wrapping a .frees
# document — and the duplication SonarCloud sees is the DSL idiom those
# documents share (`P = 100 [kPa]`, `{ comments }`, the same state-point
# naming). It is not extractable: the only way to remove it is to stop having
# a catalog of worked examples.
#
# This is a CPD scope decision on DATA, not on logic, and it is deliberately
# narrow — each path below is a file whose entire contents is a literal, never
# a component or a module with behaviour. helpExamples.ts was SPLIT OUT of
# HelpPage.tsx for exactly this reason (2,072 lines of catalog inside a 3,823-
# line component): so this list can name the data and leave the component
# analysed, rather than excluding real code to reach the data inside it.
# Everything with logic in it stays in scope, which is the rule this file
# opened with.
sonar.cpd.exclusions=\
  fixtures/**,\
  crates/frees-core/src/props/**,\
  crates/frees-core/tests/**,\
  web/src/referenceCatalog.ts,\
  web/src/componentCatalog.ts,\
  web/src/docsCatalog.ts,\
  web/src/functionCatalog.ts,\
  web/src/helpReference.ts,\
  web/src/helpExamples.ts,\
  web/src/examples.ts,\
  web/src/defaultExample.ts
