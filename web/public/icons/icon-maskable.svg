<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="frees">
  <!--
    Full-bleed variant — the source for BOTH `icon-maskable-512.png` (Android
    applies its own mask: circle, squircle, teardrop, whatever the launcher
    uses) and `apple-touch-icon.png` (iOS applies its own squircle and paints
    any transparency black, so it wants a full-bleed opaque square too).

    Same bar geometry as icon.svg, unscaled: it was sized against the maskable
    safe zone in the first place (see that file's note for the arithmetic), so
    there is no shrink-to-fit transform here and the two marks read at the same
    size. The only difference is the square corners.
  -->
  <defs>
    <linearGradient id="freesBars" x1="106" y1="148" x2="406" y2="364" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7bedcd"/>
      <stop offset="1" stop-color="#12b886"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#1a1b1e"/>
  <g fill="url(#freesBars)">
    <rect x="106" y="148" width="300" height="80" rx="40"/>
    <rect x="106" y="284" width="300" height="80" rx="40"/>
  </g>
</svg>
